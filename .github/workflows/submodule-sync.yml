name: Submodule Pointer Synchronization

on:
  workflow_dispatch:
  repository_dispatch:
    types: [submodule-update]
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: submodule-pointer-sync
  cancel-in-progress: false

jobs:
  sync-submodules:
    name: Propose verified submodule pointer updates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Resolve remote default branches
        run: git submodule update --init --remote
      - name: Open a pull request instead of pushing to the protected branch
        id: proposal
        uses: peter-evans/create-pull-request@v7
        with:
          branch: codex/sync-submodule-pointers
          base: main
          title: 'chore(submodules): propose remote default-branch pointers'
          commit-message: 'chore(submodules): propose remote default-branch pointers'
          body: 'Updates submodule pointers to their remote default branches. Required inventory checks must pass before merging.'
          add-paths: |
            gql-ddd-inventory
            js-ddd-inventory
            php-ddd-inventory
            python-ddd-inventory
            react-ddd-inventory-client
            inventory-python-sidecar
      - name: Start required checks for the bot-created pull request
        if: steps.proposal.outputs.pull-request-operation == 'created' || steps.proposal.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
        run: gh workflow run conformance.yml --ref codex/sync-submodule-pointers
