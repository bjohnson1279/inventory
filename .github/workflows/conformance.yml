name: Conformance Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-schemas:
    name: Lint Schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          
      - name: Install dependencies
        run: pip install PyYAML
        
      - name: Generate OpenAPI specs
        run: python scripts/generate_openapi.py
        
      - name: Check for schema drift (uncommitted changes)
        run: git diff --exit-code
        
      - name: Lint schema drift
        run: python scripts/lint_schema_drift.py

  syntax-check:
    name: Syntax Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [gql-ddd-inventory, js-ddd-inventory, php-ddd-inventory]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Node.js (for TS)
        if: matrix.backend != 'php-ddd-inventory'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.backend }}/package-lock.json
          
      - name: Setup PHP (for PHP)
        if: matrix.backend == 'php-ddd-inventory'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          
      - name: Check TypeScript Syntax
        if: matrix.backend != 'php-ddd-inventory'
        working-directory: ${{ matrix.backend }}
        env:
          JWT_SECRET: test-jwt-secret
          DATABASE_URL: postgresql://inventory_user:inventory_password@localhost:5432/inventory_db?schema=public
        run: |
          npm ci
          npx prisma generate
          npx tsc --noEmit
          
      - name: Check PHP Syntax
        if: matrix.backend == 'php-ddd-inventory'
        working-directory: ${{ matrix.backend }}
        run: find src -type f -name "*.php" -exec php -l {} \; | (! grep -v "No syntax errors detected")

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [gql-ddd-inventory, js-ddd-inventory, php-ddd-inventory]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: inventory_user
          POSTGRES_PASSWORD: inventory_password
          POSTGRES_DB: inventory_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Node.js
        if: matrix.backend != 'php-ddd-inventory'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.backend }}/package-lock.json
          
      - name: Setup PHP
        if: matrix.backend == 'php-ddd-inventory'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          
      - name: Get Composer Cache Directory
        if: matrix.backend == 'php-ddd-inventory'
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        if: matrix.backend == 'php-ddd-inventory'
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('php-ddd-inventory/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
          
      - name: Run TypeScript Tests
        if: matrix.backend != 'php-ddd-inventory'
        working-directory: ${{ matrix.backend }}
        env:
          JWT_SECRET: test-jwt-secret
          DATABASE_URL: postgresql://inventory_user:inventory_password@localhost:5432/inventory_db?schema=public
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: inventory_user
          DB_NAME: inventory_db
        run: |
          npm ci
          npx prisma generate
          npx prisma db push --accept-data-loss
          npm test
          
      - name: Run PHP Tests
        if: matrix.backend == 'php-ddd-inventory'
        working-directory: ${{ matrix.backend }}
        run: |
          composer install --prefer-dist --no-progress
          vendor/bin/phpunit

  conformance-tests:
    name: Conformance Tests
    needs: [lint-schemas, syntax-check, unit-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Run Docker Compose
        run: |
          docker compose -f docker-compose.conformance.yml up --build --abort-on-container-exit --exit-code-from conformance-runner
          
      - name: Upload Conformance Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report/conformance-report.json
          retention-days: 14
