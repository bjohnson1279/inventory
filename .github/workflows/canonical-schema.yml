name: Canonical PostgreSQL schema

on:
  push:
    paths: ['database/**', 'scripts/canonical_schema.py', 'scripts/import_canonical_data.py', 'tests/harness/test_canonical*.py', '.github/workflows/canonical-schema.yml']
  pull_request:
    paths: ['database/**', 'scripts/canonical_schema.py', 'scripts/import_canonical_data.py', 'tests/harness/test_canonical*.py', '.github/workflows/canonical-schema.yml']

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schema_test
          POSTGRES_PASSWORD: schema_test
          POSTGRES_DB: schema_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U schema_test -d schema_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CANONICAL_SCHEMA_TEST_DATABASE_URL: postgresql://schema_test:schema_test@127.0.0.1:5432/schema_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r database/requirements.txt pytest pytest-asyncio
      - run: python -m pytest tests/harness/test_canonical_schema.py tests/harness/test_canonical_import.py -q
