version: "3.8"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
      POSTGRES_DB: inventory_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./php-ddd-inventory/docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - conformance-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - conformance-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gql-backend:
    build:
      context: ./gql-ddd-inventory
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://inventory_user:inventory_password@postgres:5432/inventory_db?schema=public
      - JWT_SECRET=test-jwt-secret
      - SHOPIFY_API_SECRET=test-shopify-secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conformance-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  express-backend:
    build:
      context: ./js-ddd-inventory
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgresql://inventory_user:inventory_password@postgres:5432/inventory_db?schema=public
      - JWT_SECRET=test-jwt-secret
      - SHOPIFY_API_SECRET=test-shopify-secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conformance-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  php-backend:
    build:
      context: ./php-ddd-inventory
      dockerfile: docker/php/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=inventory_db
      - DB_USERNAME=inventory_user
      - DB_PASSWORD=inventory_password
      - JWT_SECRET=test-jwt-secret
      - SHOPIFY_API_SECRET=test-shopify-secret
    volumes:
      - ./php-ddd-inventory:/var/www/html
    command: >
      sh -c "composer install && php -S 0.0.0.0:8000 -t public"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - conformance-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  conformance-runner:
    image: python:3.11-slim
    volumes:
      - ./tests/conformance:/app/tests/conformance
      - ./scripts:/app/scripts
      - ./conformance-report:/app/conformance-report
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    depends_on:
      gql-backend:
        condition: service_healthy
      express-backend:
        condition: service_healthy
      php-backend:
        condition: service_healthy
    networks:
      - conformance-net
    command: >
      sh -c "pip install -q httpx pytest pytest-json-report &&
             python scripts/run_conformance.py --seed --verbose --report-dir /app/conformance-report"

networks:
  conformance-net:
    driver: bridge

volumes:
  pgdata:
