services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
      POSTGRES_DB: inventory_db
    ports:
      - "${POSTGRES_PORT:-5034}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/conformance-postgres-init.sh:/docker-entrypoint-initdb.d/00-conformance.sh:ro
      - ./php-ddd-inventory/docker/postgres/init:/conformance/php:ro
    networks:
      - conformance-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U inventory_user -d inventory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-5079}:6379"
    networks:
      - conformance-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  gql-backend:
    build:
      context: ./gql-ddd-inventory
    ports:
      - "${GQL_PORT:-5040}:4000"
    environment:
      - DATABASE_URL=postgresql://inventory_user:inventory_password@postgres:5432/inventory_gql?schema=public
      - NODE_ENV=development
      - JWT_SECRET=test-jwt-secret
      - SHOPIFY_API_SECRET=test-shopify-secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=4000
    command: sh -c "npx prisma db push && npm start"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conformance-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\" || curl -f http://localhost:4000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  express-backend:
    build:
      context: ./js-ddd-inventory
    ports:
      - "${EXPRESS_PORT:-5050}:5000"
    environment:
      - DATABASE_URL=postgresql://inventory_user:inventory_password@postgres:5432/inventory_express?schema=public
      - NODE_ENV=development
      - JWT_SECRET=test-jwt-secret
      - SHOPIFY_API_SECRET=test-shopify-secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=5000
      - ENCRYPTION_KEY=conformance-only-encryption-key
      - COMPLIANCE_PRIVATE_KEY=conformance-only-ledger-key
    command: sh -c "npx prisma db push && node dist/index.js"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - conformance-net
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:5000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\" || curl -f http://localhost:5000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  php-backend:
    build:
      context: ./php-ddd-inventory
      dockerfile: docker/php/Dockerfile
    ports:
      - "${PHP_PORT:-5080}:8000"
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=inventory_php
      - DB_USERNAME=inventory_user
      - DB_PASSWORD=inventory_password
      - JWT_SECRET=test-jwt-secret
      - SHOPIFY_API_SECRET=test-shopify-secret
      - COMPLIANCE_PRIVATE_KEY=conformance-only-ledger-key
    command: >
      php -S 0.0.0.0:8000 -t public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - conformance-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  python-backend:
    build:
      context: ./python-ddd-inventory
    ports:
      - "${PYTHON_PORT:-5081}:8000"
    environment:
      - DATABASE_URL=postgresql://inventory_user:inventory_password@postgres:5432/inventory_python
      - JWT_SECRET=test-jwt-secret
      - SHOPIFY_API_SECRET=test-shopify-secret
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=inventory_user
      - DB_PASSWORD=inventory_password
      - DB_NAME=inventory_python
      - REDIS_URL=redis://redis:6379/0
      - OUTBOX_ENABLED=false
      - ALLOW_PUBLIC_SIGNUP=true
      - OTEL_SDK_DISABLED=true
    command: >
      sh -c "python -m scripts.migrate_identity_catalog &&
             uvicorn src.presentation.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - conformance-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 120s

  conformance-runner:
    image: python:3.11-slim
    volumes:
      - ./tests/conformance:/app/tests/conformance
      - ./scripts:/app/scripts
      - ./pytest.ini:/app/pytest.ini:ro
      - ./conformance-report:/app/conformance-report
    working_dir: /app
    environment:
      - PYTHONPATH=/app
      - GRAPHQL_URL=http://gql-backend:4000
      - EXPRESS_REST_URL=http://express-backend:5000
      - PHP_REST_URL=http://php-backend:8000
      - PYTHON_REST_URL=http://python-backend:8000
      - CONFORMANCE_ADMIN_PASSWORD=conformance-test-password
      - CONFORMANCE_DB_FAULTS=1
      - CONFORMANCE_GQL_DATABASE_URL=postgresql://inventory_user:inventory_password@postgres:5432/inventory_gql
      - CONFORMANCE_EXPRESS_DATABASE_URL=postgresql://inventory_user:inventory_password@postgres:5432/inventory_express
      - CONFORMANCE_PHP_DATABASE_URL=postgresql://inventory_user:inventory_password@postgres:5432/inventory_php
      - CONFORMANCE_PYTHON_DATABASE_URL=postgresql://inventory_user:inventory_password@postgres:5432/inventory_python
    depends_on:
      gql-backend:
        condition: service_healthy
      express-backend:
        condition: service_healthy
      php-backend:
        condition: service_healthy
      python-backend:
        condition: service_healthy
    networks:
      - conformance-net
    command: >
      sh -c "pip install -q -r /app/tests/conformance/requirements.txt &&
             python scripts/run_conformance.py --seed --verbose --report-dir /app/conformance-report"

networks:
  conformance-net:
    driver: bridge

volumes:
  pgdata:
